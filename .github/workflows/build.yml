name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 جلب الكود من المستودع
        uses: actions/checkout@v4

      - name: ☕ إعداد بيئة Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🐘 إعداد Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: ⚙️ إنشاء ملفات تشغيل Gradle (بإصدار مستقر)
        run: gradle wrapper --gradle-version 8.7

      - name: 🔑 إعطاء صلاحية التشغيل
        run: chmod +x gradlew

      - name: 🔨 بناء التطبيق (APK)
        run: ./gradlew assembleDebug

      - name: 📦 حفظ ملف APK كـ Artifact للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Watch-Face-APK
          path: app/build/outputs/apk/debug/app-debug.apk
